name: Storybook Tests

on: deployment_status

permissions: {}

jobs:
  test-storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Chromatic 환경의 성공한 배포만 테스트
    if: github.event.deployment_status.environment == 'Chromatic' && github.event.deployment_status.state == 'success'
    permissions:
      contents: read
    env:
      TARGET_URL: ${{ github.event.deployment_status.environment_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun ci
      # test-runner는 chromium만 사용한다.
      - run: bunx playwright install --with-deps chromium

      # CDN 전파 등으로 곧바로 200이 아닐 수 있으므로 재시도
      - name: Wait for Storybook to be reachable
        shell: bash
        run: |
          echo "Checking: $TARGET_URL"
          for i in {1..20}; do
            CODE=$(curl -sL -o /dev/null -w "%{http_code}" --max-time 10 "$TARGET_URL" || echo "000")
            if [ "$CODE" -eq 200 ]; then
              echo "Reachable: $TARGET_URL"
              exit 0
            fi
            echo "HTTP $CODE - retry ($i/20) in 3s..."
            sleep 3
          done
          echo "Storybook not reachable: $TARGET_URL"
          exit 1

      - name: Run Storybook tests
        run: bun run test-storybook
