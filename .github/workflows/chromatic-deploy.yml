name: "Chromatic Deploy"

on: push

jobs:
  build-chromatic:
    # Dependabot이 만든 브랜치의 push에는 저장소 시크릿이 주입되지 않는다
    # (실행 로그의 `Secret source: Dependabot` — 별도의 Dependabot 시크릿 저장소만 참조).
    # 그 결과 CHROMATIC_PROJECT_TOKEN이 비어 chromaui/action이 즉시 실패하고,
    # 의존성 PR이 전부 빨간 X로 막혀 왔다. 의존성 bump에는 시각 회귀 검증이
    # 무의미하므로 건너뛴다.
    # (dependabot PR에서도 Chromatic을 돌리려면 Settings → Secrets and variables
    #  → Dependabot 에 CHROMATIC_PROJECT_TOKEN을 별도로 등록하고 이 조건을 제거)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      # chromaui/action이 반환하는 실제 배포 URL
      storybook_url: ${{ steps.chromatic.outputs.storybookUrl }}
      # 최종적으로 환경에 등록할 URL (chromatic_url or fallback_url)
      final_url: ${{ steps.final.outputs.final_url }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
      - run: bun install

      - id: chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true # 변경 없을 때 빌드 스킵될 수 있음

      # Chromatic이 제공하는 storybookUrl을 사용
      - id: final
        run: |
          echo "final_url=${{ steps.chromatic.outputs.storybookUrl }}" >> "$GITHUB_OUTPUT"

  register-deployment:
    needs: build-chromatic
    runs-on: ubuntu-latest
    # 여기서 Environment URL을 등록하면 GitHub이 deployment/deployment_status 이벤트를 발생시킵니다.
    environment:
      name: Chromatic
      url: ${{ needs.build-chromatic.outputs.final_url }}

    steps:
      - run: |
          echo "Registered deployment URL:"
          echo "${{ needs.build-chromatic.outputs.final_url }}"
