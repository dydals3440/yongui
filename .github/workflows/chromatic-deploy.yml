name: "Chromatic Deploy"

on: push

permissions: {}

jobs:
  build-chromatic:
    # Dependabot이 만든 브랜치의 push에는 저장소 시크릿이 주입되지 않는다
    # (실행 로그의 `Secret source: Dependabot` — 별도의 Dependabot 시크릿 저장소만 참조).
    # 그 결과 CHROMATIC_PROJECT_TOKEN이 비어 chromaui/action이 즉시 실패하고,
    # 의존성 PR이 전부 빨간 X로 막혀 왔다. 의존성 bump에는 시각 회귀 검증이
    # 무의미하므로 건너뛴다.
    # (dependabot PR에서도 Chromatic을 돌리려면 Settings → Secrets and variables
    #  → Dependabot 에 CHROMATIC_PROJECT_TOKEN을 별도로 등록하고 이 조건을 제거)
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      # chromaui/action이 반환하는 실제 배포 URL. 다음 job이 환경 URL로 등록한다.
      final_url: ${{ steps.chromatic.outputs.storybookUrl }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun ci

      - id: chromatic
        uses: chromaui/action@0a7067e5ffc663a631b14db505d8a94b26e1bf2f # v18.15.3
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true # 변경 없을 때 빌드 스킵될 수 있음

  register-deployment:
    needs: build-chromatic
    # TurboSnap이 빌드를 건너뛰면 storybookUrl이 비어 있다. 빈 URL로 배포를 등록하면
    # Storybook Tests가 접속할 주소 없이 실패하므로, 새 Storybook이 있을 때만 등록한다.
    if: needs.build-chromatic.outputs.final_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    # 여기서 Environment URL을 등록하면 GitHub이 deployment/deployment_status 이벤트를 발생시킵니다.
    environment:
      name: Chromatic
      url: ${{ needs.build-chromatic.outputs.final_url }}

    steps:
      - env:
          FINAL_URL: ${{ needs.build-chromatic.outputs.final_url }}
        run: |
          echo "Registered deployment URL:"
          echo "$FINAL_URL"
