version: 2
updates:
  - package-ecosystem: "bun"
    pull-request-branch-name:
      separator: "-"
    directory: "/"
    schedule:
      interval: "weekly"
    # 배포 직후 회수되는 악성·결함 릴리스를 피하려고 7일(메이저 14일) 지난 버전만 올린다.
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "vitest"
      pandacss:
        patterns:
          - "@pandacss/*"
    ignore:
      # Storybook의 react-docgen-typescript가 TS 컴파일러 JS API를 쓰는데,
      # TypeScript 7은 그 API를 내보내지 않는다. 6.x에 머문다.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    pull-request-branch-name:
      separator: "-"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
